name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and CJK font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Validate skill
        run: python scripts/validate_skill.py
      - name: Test
        run: pytest -q
      - name: Check fatal Python errors
        run: python -m ruff check src tests scripts --select F821,F822,F823,E9
